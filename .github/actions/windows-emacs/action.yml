name: Windows GNU Emacs
description: Install pinned GNU Emacs 31.1 with mirror fallback and retries
runs:
  using: composite
  steps:
    - name: Install GNU Emacs 31.1
      shell: pwsh
      run: |
        $zip = "$env:RUNNER_TEMP\emacs-31.1.zip"
        $urls = @('https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip',
                  'https://ftpmirror.gnu.org/emacs/windows/emacs-31/emacs-31.1.zip',
                  'https://mirrors.kernel.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip')
        $done = $false
        foreach ($attempt in 1..3) {
          foreach ($url in $urls) {
            try { Invoke-WebRequest $url -OutFile $zip -TimeoutSec 300; $done = $true; break }
            catch { Write-Host "download failed ($attempt): $url $_" }
          }
          if ($done) { break }
          Start-Sleep -Seconds 30
        }
        if (-not $done) { throw 'GNU Emacs 31.1 download failed on every mirror' }
        Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\emacs-31.1"
        $bin = Get-ChildItem "$env:RUNNER_TEMP\emacs-31.1" -Recurse -Filter emacs.exe | Select-Object -First 1
        $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Check GNU Emacs version
      shell: bash
      run: emacs --batch -Q --eval '(unless (equal emacs-version "31.1") (error "need GNU 31.1, got %s" emacs-version))'
