name: Windows native F1 (manual acceptance)

# Manual acceptance of Doc 214 W1.2. Host proofs cannot qualify Windows execution.
# workflow_dispatch needs this file on the default branch, so pushes to the
# native-windows branch also run it until the port is merged.
on:
  workflow_dispatch:
  push:
    branches: [native-windows]

permissions:
  contents: read

jobs:
  native-f1:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # setup-emacs-windows returns 404 for 31.1; install the official GNU zip.
      - name: Install GNU Emacs 31.1
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\emacs-31.1.zip"
          Invoke-WebRequest https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\emacs-31.1"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\emacs-31.1" -Recurse -Filter emacs.exe | Select-Object -First 1
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check GNU Emacs version
        shell: bash
        run: emacs --batch -Q --eval '(unless (equal emacs-version "31.1") (error "need GNU 31.1, got %s" emacs-version))'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install proof decoder dependencies
        run: python -m pip install capstone pyelftools
      - name: Host Win64 emitter and receipt negative controls
        shell: bash
        run: |
          python test/support/check-windows-loaddefs.py "$RUNNER_TEMP/emacs-31.1.zip"
          python test/support/check-windows-native-host.py
          python test/support/run-windows-native-f1-test.py
      - name: Build the Windows PE reader
        shell: bash
        run: make standalone-reader NELISP_STANDALONE_TARGET=windows-x86_64
      - name: Windows native F1 (fresh load, GC, registers, nested throws, trust controls)
        shell: pwsh
        run: |
          python test/support/run-windows-native-f1.py target/nelisp.exe --work target/windows-native-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve acceptance evidence even on native refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-f1
          path: |
            target/windows-loaddefs-*/
            target/windows-native/
            target/windows-native-ci/
            target/nelisp.exe
            target/nelisp.exe.native-startup.el
          if-no-files-found: warn
