name: Windows native acceptance

# DIAGNOSTIC VARIANT on branch native-windows (2026-10-16): reproduces the F1B
# exit-load failure, void-function (signal-p), against the reader built by run
# 38885693702 and varies one input at a time.  See
# test/support/diag-windows-f1b.py.  Not an acceptance run.

on:
  workflow_dispatch:
  push:
    branches: [native-windows]

permissions:
  contents: read
  actions: read

jobs:
  diag-f1b:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-native-tools
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-reader
          path: target
          run-id: 38885693702
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose F1B exit-load
        timeout-minutes: 50
        shell: pwsh
        run: |
          $env:NELISP_WINDOWS_NATIVE_DEADLINE = '900'
          python test/support/diag-windows-f1b.py target/nelisp.exe
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diag-f1b
          path: target/diag-f1b/
