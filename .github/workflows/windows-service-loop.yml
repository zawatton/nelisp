# Raw GNU Emacs loopback TCP reconnect-ordering probe; no NeLisp service code
# or runtime build is involved.
name: windows-service-loop

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Cycles for each selected reconnect mode
        required: false
        default: '200'
      parallel:
        description: Concurrent independent GNU Emacs probe processes (1-4)
        required: false
        default: '4'
      event_pump:
        description: Process output pump used while waiting for probe events
        required: false
        type: choice
        options:
          - client
          - all
        default: client
      eof_control:
        description: Include the client process-send-eof reconnect control
        required: false
        type: boolean
        default: false
      mode_set:
        description: Probe the default controls or an opt-in reconnect differential
        required: false
        type: choice
        options:
          - default
          - eof-delete-pair
          - listener-lifetime-pair
        default: default

jobs:
  reconnect-probe:
    name: raw TCP reconnect probe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CYCLES: ${{ inputs.cycles }}
      PARALLEL: ${{ inputs.parallel }}
      W32_PROBE_EVENT_PUMP: ${{ inputs.event_pump }}
      W32_PROBE_EOF_CONTROL: ${{ inputs.eof_control }}
      W32_PROBE_MODE_SET: ${{ inputs.mode_set }}
    steps:
      - uses: actions/checkout@v4

      # Match the GNU Emacs 31.1 installation used by the Windows ERT lane.
      - name: Set up Emacs (Windows)
        shell: pwsh
        env:
          EMACS_WIN_VERSION: '31.1'
        run: |
          $v = $env:EMACS_WIN_VERSION
          $major = $v.Split('.')[0]
          $dir = Join-Path $env:RUNNER_TEMP "emacs-$v"
          if (-not (Test-Path $dir)) {
            $zip = "$dir.zip"
            Invoke-WebRequest "https://ftp.gnu.org/gnu/emacs/windows/emacs-$major/emacs-$v.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir
          }
          $exe = Get-ChildItem $dir -Recurse -Filter emacs.exe | Select-Object -First 1
          if (-not $exe) { throw "emacs.exe not found in emacs-$v.zip" }
          $exe.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $exe.FullName --version | Select-Object -First 1

      - name: Run raw reconnect probe
        shell: bash
        run: |
          set -eu
          logdir="$RUNNER_TEMP/w32-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$logdir"
          case "$PARALLEL" in 1|2|3|4) ;; *) echo "parallel must be 1..4: $PARALLEL"; exit 2 ;; esac
          case "$W32_PROBE_MODE_SET" in
            default) ;;
            eof-delete-pair)
              if [ "$W32_PROBE_EOF_CONTROL" != true ]; then
                echo 'eof-delete-pair requires eof_control=true'
                exit 2
              fi
              ;;
            listener-lifetime-pair)
              if [ "$W32_PROBE_EOF_CONTROL" != true ]; then
                echo 'listener-lifetime-pair requires eof_control=true'
                exit 2
              fi
              ;;
            *) echo "unknown or empty W32_PROBE_MODE_SET: $W32_PROBE_MODE_SET"; exit 2 ;;
          esac
          echo "emacs=$(command -v emacs) cycles_per_mode=$CYCLES parallel=$PARALLEL mode_set=$W32_PROBE_MODE_SET event_pump=$W32_PROBE_EVENT_PUMP eof_control=$W32_PROBE_EOF_CONTROL artifact_dir=$logdir"
          pids=()
          for i in $(seq 1 "$PARALLEL"); do
            worker_dir="$logdir/worker-$i"
            mkdir -p "$worker_dir"
            (
              set +e
              ulimit -v 8388608
              limit_rc=$?
              if [ "$limit_rc" -ne 0 ]; then
                printf '%s\n' "$limit_rc" >"$worker_dir/w32-probe-exit-code.txt"
                exit "$limit_rc"
              fi
              if [ "$W32_PROBE_MODE_SET" = listener-lifetime-pair ]; then
                if [ "$((i % 2))" -eq 1 ]; then
                  arms=(reference churn)
                else
                  arms=(churn reference)
                fi
                worker_failed=0
                for arm in "${arms[@]}"; do
                  arm_dir="$worker_dir/$arm"
                  mkdir -p "$arm_dir"
                  W32_PROBE_LISTENER_ARM="$arm" /usr/bin/timeout 1100 emacs --batch -Q \
                    -l tools/ai/w32-reconnect-probe.el -- \
                    --cycles "$CYCLES" --artifact-dir "$arm_dir" \
                    >"$arm_dir/w32-probe-run.log" 2>&1
                  rc=$?
                  printf '%s\n' "$rc" >"$arm_dir/w32-probe-exit-code.txt"
                  write_rc=$?
                  if [ "$write_rc" -ne 0 ]; then exit "$write_rc"; fi
                  if [ "$rc" -ne 0 ]; then worker_failed=1; fi
                done
                exit "$worker_failed"
              else
                /usr/bin/timeout 1100 emacs --batch -Q \
                  -l tools/ai/w32-reconnect-probe.el -- \
                  --cycles "$CYCLES" --artifact-dir "$worker_dir" \
                  >"$worker_dir/w32-probe-run.log" 2>&1
                rc=$?
                printf '%s\n' "$rc" >"$worker_dir/w32-probe-exit-code.txt"
                write_rc=$?
                if [ "$write_rc" -ne 0 ]; then exit "$write_rc"; fi
                exit "$rc"
              fi
            ) &
            pids+=("$!")
          done
          failed=0
          for i in $(seq 1 "$PARALLEL"); do
            rc=0
            if wait "${pids[$((i - 1))]}"; then rc=0; else rc=$?; fi
            echo "W32_PROBE_WORKER worker=$i exit=$rc"
            if [ -f "$logdir/worker-$i/w32-probe-run.log" ]; then
              cat "$logdir/worker-$i/w32-probe-run.log"
            elif [ "$W32_PROBE_MODE_SET" = listener-lifetime-pair ]; then
              for arm in reference churn; do
                arm_dir="$logdir/worker-$i/$arm"
                if [ ! -f "$arm_dir/w32-probe-exit-code.txt" ] || [ ! -f "$arm_dir/w32-probe-run.log" ]; then
                  echo "worker=$i arm=$arm status-or-log missing"
                  failed=1
                  continue
                fi
                arm_rc=$(cat "$arm_dir/w32-probe-exit-code.txt")
                echo "W32_PROBE_ARM worker=$i arm=$arm exit=$arm_rc"
                cat "$arm_dir/w32-probe-run.log"
                if [ "$arm_rc" -ne 0 ]; then failed=1; fi
              done
            else
              echo "worker=$i run log missing"
              failed=1
            fi
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          echo "W32_PROBE_PARALLEL_DONE workers=$PARALLEL failed=$failed"
          [ "$failed" -eq 0 ]

      - name: Upload raw TCP probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w32-reconnect-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w32-probe-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: error
