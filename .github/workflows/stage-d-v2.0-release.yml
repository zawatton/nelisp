name: NeLisp semver release pipeline

# Zero-Rust semver release pipeline for the standalone NeLisp artifacts.
#
# This workflow is self-contained: it builds, executes the standalone reader
# test, runs the release soak on linux-x86_64, checksums each artifact, and
# uploads the cross-architecture bundles on either:
#
#   - a semver-style release tag push (`vX.Y.Z'), or
#   - manual workflow_dispatch (e.g. dry-run a release candidate).
#
# The standalone build is pure Elisp and requires no legacy native toolchain.
# v1.3.0 release blockers are Linux x86_64 and Linux ARM64.  macOS ARM64 is
# retained as a deferred job below so its unverified state remains visible.
# SHA-256 and the ad-hoc signature placeholder keep each uploaded artifact
# bundle self-contained.
#
# Outputs are uploaded as workflow artifacts only.  GitHub Release
# upload + asset attach remains a separate publication step.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version label (default: v1.3.0)'
        required: false
        default: 'v1.3.0'
  push:
    tags:
      - 'v*.*.*'

env:
  # Tag pushes use the semver tag; manual dispatch keeps its input/default.
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_version || 'v1.3.0' }}

jobs:
  build-linux-x86_64:
    name: blocker — linux-x86_64
    runs-on: ubuntu-latest
    env:
      NELISP_STANDALONE_TARGET: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Build and test standalone reader
        run: make standalone-reader-test

      - name: Build release artifact
        run: ./tools/build-release-artifact.sh linux-x86_64 ${{ env.RELEASE_VERSION }}

      - name: Verify release artifact bundle
        run: ./tools/verify-standalone-tarball.sh ${{ env.RELEASE_VERSION }} linux-x86_64 --release-artifact

      - name: Verify SHA256 checksum
        run: cd dist && sha256sum --check ${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz.sha256

      - name: Verify standalone soak failure detection
        run: python3 test/nelisp-standalone-soak-test.py

      - name: Standalone NeLisp GC soak (blocker tier、1h)
        run: python3 tools/nelisp-standalone-soak.py --binary target/nelisp --duration 3600

      - name: Verify ad-hoc signature payload (Doc 32 v2 §2.5)
        run: |
          sig="dist/${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz.sig"
          if [ ! -s "$sig" ]; then
            echo "ERROR: signature file missing or empty: $sig" >&2
            exit 1
          fi
          head -1 "$sig" | grep -q '^ad-hoc-signature ' \
            || { echo "ERROR: signature payload malformed" >&2; exit 1; }
          echo "ad-hoc signature OK (real GPG = v2.1+ per Doc 32 v2 §2.5 + §8)"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_VERSION }}-linux-x86_64
          path: |
            dist/${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
            dist/${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz.sha256
            dist/${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz.sig

  build-macos-arm64:
    name: deferred — macos-arm64 (unverified)
    # Darwin artifact qualification is deferred for this release by project
    # decision.  A skipped job must not be represented as a release PASS.
    if: ${{ false }}
    runs-on: macos-14
    env:
      NELISP_STANDALONE_TARGET: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Build and test standalone reader
        run: make standalone-reader-test

      - name: Diagnose standalone host helper failure
        if: failure()
        shell: bash
        run: |
          export NELISP_HOST_EMACS="$(command -v emacs)"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          binary = Path("target/nelisp").resolve()
          if not binary.is_file():
              raise SystemExit("No reader binary was produced")
          print("Host Emacs:", os.environ["NELISP_HOST_EMACS"], flush=True)
          host = json.dumps(os.environ["NELISP_HOST_EMACS"])
          probes = [
              "(list system-type (getenv \"PATH\"))",
              "(list (file-exists-p \".\") (file-directory-p \".\") (file-exists-p (getenv \"NELISP_HOST_EMACS\")))",
              f"(nelisp--syscall-path-int 21 {host} 0)",
              f"(file-exists-p {host})",
              "(executable-find \"emacs\")",
              f"(call-process {host} nil nil nil \"--version\")",
          ]
          for form in probes:
              print("Probe:", form, flush=True)
              try:
                  result = subprocess.run([str(binary), "--eval", form],
                                          capture_output=True, text=True, timeout=30)
                  print("Exit:", result.returncode,
                        "stdout:", repr(result.stdout[:8192]),
                        "stderr:", repr(result.stderr[:8192]), flush=True)
              except subprocess.TimeoutExpired:
                  print("Probe timed out after 30 seconds", flush=True)
          PY

      - name: Build release artifact
        run: ./tools/build-release-artifact.sh macos-arm64 ${{ env.RELEASE_VERSION }}

      - name: Verify release artifact bundle
        run: ./tools/verify-standalone-tarball.sh ${{ env.RELEASE_VERSION }} macos-arm64 --release-artifact

      - name: Verify SHA256 checksum
        run: cd dist && shasum -a 256 --check ${{ env.RELEASE_VERSION }}-macos-arm64.tar.gz.sha256

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_VERSION }}-macos-arm64
          path: |
            dist/${{ env.RELEASE_VERSION }}-macos-arm64.tar.gz
            dist/${{ env.RELEASE_VERSION }}-macos-arm64.tar.gz.sha256
            dist/${{ env.RELEASE_VERSION }}-macos-arm64.tar.gz.sig

  build-linux-arm64:
    name: blocker — linux-arm64
    runs-on: ubuntu-22.04-arm
    env:
      NELISP_STANDALONE_TARGET: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Build and test standalone reader
        run: make standalone-reader-test

      - name: Build release artifact
        run: ./tools/build-release-artifact.sh linux-arm64 ${{ env.RELEASE_VERSION }}

      - name: Verify release artifact bundle
        run: ./tools/verify-standalone-tarball.sh ${{ env.RELEASE_VERSION }} linux-arm64 --release-artifact

      - name: Verify SHA256 checksum
        run: cd dist && sha256sum --check ${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz.sha256

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_VERSION }}-linux-arm64
          path: |
            dist/${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz
            dist/${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz.sha256
            dist/${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz.sig

  collect-manifest:
    name: collect release manifest
    needs: [build-linux-x86_64, build-macos-arm64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render manifest
        run: |
          mkdir -p release-out
          cp release/stage-d-v2.0/manifest.json release-out/manifest.template.json
          # Keep the manifest template and collected artifact listing in the
          # workflow artifacts; GitHub Release asset publication is separate.
          ls -R artifacts > release-out/artifact-listing.txt
          echo "RELEASE_VERSION=${{ env.RELEASE_VERSION }}" >> release-out/artifact-listing.txt
          echo "macos-arm64=deferred (unverified; excluded from v1.3.0 release qualification)" >> release-out/artifact-listing.txt

      - name: Upload manifest bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_VERSION }}-manifest
          path: release-out/
