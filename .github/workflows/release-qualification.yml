name: Phase 7.5.3 release qualification

# Doc 32 v2 LOCKED §3.3 + §7 4-tier gate taxonomy:
#   - blocker            : linux-x86_64 build + 1h soak + checksum verify
#   - non-blocker (v1.0 時限): macos-arm64 / linux-arm64 (§11、v1.1+ で blocker promote 想定)
#   - post-ship audit    : weekly 24h soak (release-audit、別 workflow scope)
#   - release artifact   : tarball + sha256 + ad-hoc signature (§2.3 採用 A + §2.10 採用 A)
#
# Triggers:
#   - tag push matching stage-d-v2.* — release qualification on tagged commit
#   - workflow_dispatch              — manual qualification run
#
# Artifacts: each platform matrix leg uploads its tarball + checksum + sig
# under name `stage-d-v2.0-<platform>` so a downstream release-publish job
# (out of scope for Phase 7.5.3) can collect them.

on:
  workflow_dispatch:
  push:
    tags:
      - 'stage-d-v2.*'

jobs:
  build-linux-x86_64:
    name: blocker — linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Build release artifact
        run: ./tools/build-release-artifact.sh linux-x86_64 stage-d-v2.0

      - name: Verify checksum
        run: cd dist && sha256sum --check stage-d-v2.0-linux-x86_64.tar.gz.sha256

      - name: Soak (blocker tier、1h)
        env:
          SOAK_DURATION_HOURS: '1'
        run: ./tools/soak-test.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-v2.0-linux-x86_64
          path: |
            dist/stage-d-v2.0-linux-x86_64.tar.gz
            dist/stage-d-v2.0-linux-x86_64.tar.gz.sha256
            dist/stage-d-v2.0-linux-x86_64.tar.gz.sig

  build-macos-arm64:
    name: non-blocker (v1.0 時限) — macos-arm64
    runs-on: macos-14
    # Doc 32 v2 §11 LOCKED: arm64 = v1.0 限定 non-blocker (時限措置)、
    # v1.1+ で blocker promote 想定 (6 ヶ月以内 target、anvil leverage 込み).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Build release artifact
        run: ./tools/build-release-artifact.sh macos-arm64 stage-d-v2.0

      - name: Verify checksum
        run: cd dist && shasum -a 256 --check stage-d-v2.0-macos-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-v2.0-macos-arm64
          path: |
            dist/stage-d-v2.0-macos-arm64.tar.gz
            dist/stage-d-v2.0-macos-arm64.tar.gz.sha256
            dist/stage-d-v2.0-macos-arm64.tar.gz.sig

  build-linux-arm64:
    name: non-blocker (v1.0 時限) — linux-arm64
    runs-on: ubuntu-22.04-arm
    # Doc 32 v2 §11 LOCKED: 同上 (v1.1+ で blocker promote 想定).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      # Adjacent defect flagged in fe3ec9328 (the gap #5 commit on this
      # branch): this step used to call build-release-artifact.sh with no
      # NELISP_STANDALONE_TARGET set, and the Makefile's STANDALONE_GATE_TARGET
      # defaults to linux-x86_64 whenever that variable is unset and $(OS) !=
      # Windows_NT.  So the tarball this step has been shipping as
      # "linux-arm64" -- on an ubuntu-22.04-arm runner -- actually contains a
      # linux-x86_64 binary: the wrong instruction set for this platform,
      # never caught because nothing ever executed it (checksum-only
      # verification, and the runnable-on-host predicate this branch also
      # fixes turned every execution-based gate away before this fix).
      # Setting NELISP_STANDALONE_TARGET=linux-aarch64 here is NOT
      # CI-verified from this session (no arm64 runner available); the
      # likeliest first-run outcome is NOT a clean fix but a new, louder
      # failure: build-release-artifact.sh hardcodes
      # STANDALONE_BIN="target/nelisp", while
      # `nelisp-standalone--output-path' arch-suffixes cross-built targets
      # (linux-aarch64 -> target/nelisp-aarch64) "so they never clobber the
      # host-arch target/nelisp" -- a policy written for cross-building
      # linux-aarch64 alongside a linux-x86_64 host build, not for running
      # natively on real arm64 hardware where there is no host-arch binary to
      # avoid clobbering.  With the target now set correctly, `make
      # standalone-reader' will build target/nelisp-aarch64, the script's own
      # `[[ -x "$STANDALONE_BIN" ]]' check on target/nelisp will still see
      # nothing there, and it will exit 1 with "standalone binary still
      # missing after build: target/nelisp" -- turning a silent
      # wrong-architecture artifact into a loud, diagnosable failure instead
      # of a working correctly-labeled one.  Making build-release-artifact.sh
      # (or the output-path policy) target-aware is the follow-up fix; out of
      # scope here per instruction to touch only this job's target wiring.
      - name: Build release artifact
        env:
          NELISP_STANDALONE_TARGET: linux-aarch64
        run: ./tools/build-release-artifact.sh linux-arm64 stage-d-v2.0

      - name: Verify checksum
        run: cd dist && sha256sum --check stage-d-v2.0-linux-arm64.tar.gz.sha256

      # 2026-08-22 survey gap #5: nelisp-standalone--target-runnable-on-host-p
      # (scripts/nelisp-standalone-build.el) did not recognize this runner as
      # able to run a linux-aarch64 binary, so every binary-building
      # correctness gate silently reported "not runnable" here and this
      # artifact was validated only by checksum, never executed.  The
      # `linux-arm64' PLATFORM arg above only names the release tarball; the
      # `Build release artifact' step calls `make standalone-reader' with no
      # NELISP_STANDALONE_TARGET, which defaults to linux-x86_64 -- so
      # target/nelisp there is NOT the binary this step exercises.  These
      # steps set NELISP_STANDALONE_TARGET=linux-aarch64 explicitly and build
      # to target/nelisp-aarch64 (arch-suffixed so it never collides with the
      # x86_64 one above), a genuinely separate, real ARM64 build+run.  This
      # is the FIRST time this code path has ever executed on real hardware;
      # see the predicate's docstring for what is and is not exercised
      # elsewhere already.  (The `Build release artifact' step above now also
      # sets NELISP_STANDALONE_TARGET=linux-aarch64, fixing the adjacent
      # mislabeled-artifact defect noted there, but is expected to fail
      # before producing anything -- see that step's comment.  This gate
      # builds target/nelisp-aarch64 through its own independent
      # `make standalone-reader-test' invocation regardless of whether that
      # step succeeds, so it is unaffected either way.)
      - name: Standalone reader correctness gate (linux-aarch64, first real run)
        env:
          NELISP_STANDALONE_TARGET: linux-aarch64
        run: make standalone-reader-test

      - name: Native artifact correctness gate (linux-aarch64, first real run)
        env:
          NELISP_STANDALONE_TARGET: linux-aarch64
          NELISP: target/nelisp-aarch64
        run: make nelisp-native-artifact-gate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-v2.0-linux-arm64
          path: |
            dist/stage-d-v2.0-linux-arm64.tar.gz
            dist/stage-d-v2.0-linux-arm64.tar.gz.sha256
            dist/stage-d-v2.0-linux-arm64.tar.gz.sig
