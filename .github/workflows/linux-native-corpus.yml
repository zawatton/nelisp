name: Linux native corpus acceptance

# A push opts into the expensive lane via [linux-corpus], like Windows.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-reader:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-corpus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Emacs 31.1
        uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - name: Install dynamic reader and gccjit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgccjit-14-dev libffi-dev
          python3 -m pip install --break-system-packages capstone pyelftools
      - name: Require the GNU 31.1 dialect and x86_64 Linux
        run: |
          emacs -Q --batch --eval '(unless (equal emacs-version "31.1") (error "GNU Emacs 31.1 required"))'
          test "$(uname -m)" = x86_64
          python3 test/support/import-ci-corpus-receipts.py --self-test
      - name: Build one dynamic reader and full compiler cold image
        env:
          NELISP_READER_DYNAMIC: '1'
          NELISP_STANDALONE_NATIVE_COMPILER_COLD: '1'
        run: |
          timeout -k 10 4800 make standalone-reader
          python3 test/support/import-ci-corpus-receipts.py --record-reader
      - name: Share the exact reader, startup, cold image and source identity
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-reader
          path: |
            target/nelisp
            target/nelisp.cold
            target/nelisp.native-startup.el
            target/nelisp-artifact-runtime.el*
            target/ci-reader.json
          if-no-files-found: error

  # Eight compiler-unit shards per backend, two native workers per runner.
  # Budget 5.5 h wall per corpus; the 5 h 50 min job cap stays below 6 h.
  # This is conservative headroom, not an observed Linux runner timing.
  native-u10:
    needs: build-reader
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        backend: [in-house, gccjit]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - name: Require GNU Emacs 31.1 and install gccjit
        run: |
          emacs -Q --batch --eval '(unless (equal emacs-version "31.1") (error "GNU Emacs 31.1 required"))'
          sudo apt-get update
          sudo apt-get install -y libgccjit-14-dev libffi-dev
      - uses: actions/download-artifact@v4
        with:
          name: linux-native-reader
          path: target
      - name: Run U10 compiler-unit shard and seal raw evidence
        run: |
          chmod 500 target/nelisp
          python3 test/support/run-native-corpus-u10.py target/nelisp --cold --backend ${{ matrix.backend }} --require-complete --jobs 2 --cold-jobs 2 --cold-batch-size 2 --load-batch-size 4 --shard ${{ matrix.shard }}/8 --run-deadline 19800 | tee target/linux-u10-run.log
          python3 test/support/import-ci-corpus-receipts.py target/u10-corpus-* --seal-u10 --backend ${{ matrix.backend }}
      - name: Preserve shard receipts and transcripts even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-u10-${{ matrix.backend }}-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            target/u10-corpus-*/**/*.json
            target/u10-corpus-*/**/*.out
            target/u10-corpus-*/**/*.err
            target/u10-corpus-*/**/*.el
            target/linux-u10-run.log
          if-no-files-found: error

  native-u10-verdict:
    needs: [build-reader, native-u10]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [in-house, gccjit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-native-reader
          path: target
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-native-u10-${{ matrix.backend }}-*
          path: target/u10-shards
      - name: Require all eight shards, 230 slots and protected controls in both phases
        run: |
          python3 test/support/import-ci-corpus-receipts.py target/u10-shards --merge-u10 --backend ${{ matrix.backend }} --require-complete --output target/linux-u10-${{ matrix.backend }}-verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-u10-verdict-${{ matrix.backend }}
          path: target/linux-u10-${{ matrix.backend }}-verdict.json
          if-no-files-found: error

  native-f3:
    needs: build-reader
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        backend: [in-house, gccjit]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - name: Require GNU Emacs 31.1 and install gccjit
        run: |
          emacs -Q --batch --eval '(unless (equal emacs-version "31.1") (error "GNU Emacs 31.1 required"))'
          sudo apt-get update
          sudo apt-get install -y libgccjit-14-dev libffi-dev
      - uses: actions/download-artifact@v4
        with:
          name: linux-native-reader
          path: target
      - name: Run all 52 fresh real functions and seal raw evidence
        run: |
          chmod 500 target/nelisp
          python3 test/support/run-native-real-corpus.py target/nelisp --cold --backend ${{ matrix.backend }} --fresh --jobs 2 --load-jobs 1 --batch-size 3 --load-batch-size 4 --run-deadline 19800 | tee target/linux-f3-run.log
          python3 test/support/import-ci-corpus-receipts.py target/f3-corpus-* --seal-f3 --backend ${{ matrix.backend }} --log target/linux-f3-run.log
      - name: Preserve F3 receipts and transcripts even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-f3-${{ matrix.backend }}
          include-hidden-files: true
          path: |
            target/f3-corpus-*/**/*.json
            target/f3-corpus-*/**/*.out
            target/f3-corpus-*/**/*.err
            target/f3-corpus-*/**/*.el
            target/f3-corpus-*/**/*.log
            target/linux-f3-run.log
          if-no-files-found: error
