name: stage-d-v3.0 standalone parity

# Zero-Rust native standalone gate for the short `nelisp' CLI.
# Each platform runs the same verifier users run locally, including native
# eval, reader, REPL, cache identity, parallel build, tarball verify, install,
# installed binary execution, and installed bin/anvil CAD/SVG smoke.

on:
  workflow_dispatch:
    inputs:
      related_ref:
        description: 'Branch name to use for sibling nelisp-emacs/anvil.el checkouts; defaults to this workflow ref'
        required: false
        type: string
      nelisp_emacs_ref:
        description: 'Optional branch override for nelisp-emacs; defaults to related_ref'
        required: false
        type: string
      anvil_ref:
        description: 'Optional branch override for anvil.el; defaults to related_ref'
        required: false
        type: string
  push:
    branches: ['main']
    paths:
      - '.github/workflows/stage-d-v3.0-standalone.yml'
      - 'lisp/**'
      - 'packages/**'
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'bin/**'
      - 'release/stage-d-v3.0/**'
      - 'README.org'
      - 'README-stage-d-v3.0.org'
      - 'Makefile'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/stage-d-v3.0-standalone.yml'
      - 'lisp/**'
      - 'packages/**'
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'bin/**'
      - 'release/stage-d-v3.0/**'
      - 'README.org'
      - 'README-stage-d-v3.0.org'
      - 'Makefile'

jobs:
  linux-x86_64:
    name: linux-x86_64 standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout related standalone vendor repos
        shell: bash
        env:
          RELATED_REF: ${{ inputs.related_ref || github.head_ref || github.ref_name }}
          NELISP_EMACS_REF: ${{ inputs.nelisp_emacs_ref || inputs.related_ref || github.head_ref || github.ref_name }}
          ANVIL_REF: ${{ inputs.anvil_ref || inputs.related_ref || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          clone_related() {
            local repo="$1" dest="$2" ref="$3"
            local url="https://github.com/zawatton/${repo}.git"
            # A matching branch wins: that is the whole point of this parity
            # run -- build the sibling at the same feature branch when one
            # exists.  Falling back to the sibling's OWN default branch when it
            # does not is what makes the run possible at all: `anvil.el' is on
            # `master', this repo is on `main', and demanding `main' there
            # failed every run since the branch rename -- 12 consecutive
            # failures, none of them about the code being tested.
            if git ls-remote --exit-code --heads "$url" "$ref" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$ref" "$url" "../${dest}"
              return
            fi
            # Probe the two names a default branch actually has here rather
            # than parsing `--symref' output: that parse works locally but
            # came back empty on the runner, and `gh api' is not an option
            # because this workflow is given no token.  `git ls-remote
            # --heads NAME' is a plain yes/no against the same URL that is
            # about to be cloned.
            local fallback=""
            local candidate
            for candidate in main master; do
              if git ls-remote --exit-code --heads "$url" "$candidate" >/dev/null 2>&1; then
                fallback="$candidate"
                break
              fi
            done
            if [ -n "$fallback" ] && [ "$fallback" != "$ref" ]; then
              echo "::notice::related repo ${repo} has no branch ${ref}; using its default branch ${fallback}"
              git clone --depth 1 --branch "$fallback" "$url" "../${dest}"
              return
            fi
            echo "::error::required related repo ${repo} has neither branch ${ref} nor a readable default branch"
            exit 1
          }
          clone_related nelisp-emacs nelisp-emacs "${NELISP_EMACS_REF:-${RELATED_REF:-main}}"
          clone_related anvil.el anvil.el "${ANVIL_REF:-${RELATED_REF:-main}}"

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: '30.2'

      - name: Verify Linux standalone parity
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-logs
          ./scripts/verify-cross-platform.sh --parallel-jobs 2 --include-tarball 2>&1 | tee verification-logs/linux-x86_64.log

      - name: Upload Linux verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-v3.0-linux-x86_64-log
          path: verification-logs/linux-x86_64.log

      - name: Upload Linux standalone tarball
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-v3.0-linux-x86_64
          path: |
            dist/anvil-stage-d-v3.0-linux-x86_64.tar.gz
            dist/anvil-stage-d-v3.0-linux-x86_64.tar.gz.sha256

  macos-aarch64:
    name: macos-aarch64 standalone
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout related standalone vendor repos
        shell: bash
        env:
          RELATED_REF: ${{ inputs.related_ref || github.head_ref || github.ref_name }}
          NELISP_EMACS_REF: ${{ inputs.nelisp_emacs_ref || inputs.related_ref || github.head_ref || github.ref_name }}
          ANVIL_REF: ${{ inputs.anvil_ref || inputs.related_ref || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          clone_related() {
            local repo="$1" dest="$2" ref="$3"
            local url="https://github.com/zawatton/${repo}.git"
            # A matching branch wins: that is the whole point of this parity
            # run -- build the sibling at the same feature branch when one
            # exists.  Falling back to the sibling's OWN default branch when it
            # does not is what makes the run possible at all: `anvil.el' is on
            # `master', this repo is on `main', and demanding `main' there
